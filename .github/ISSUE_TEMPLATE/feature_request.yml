name: Feature request
description: Suggest an improvement or new capability for Stream GUI RS
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea! Search [existing issues](https://github.com/ChrisLauinger77/stream-gui-rs/issues?q=is%3Aissue) first. If a request already covers your use case, please add context there instead of opening a duplicate.
        This report is public; never include credentials or other secrets.
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing requests
      options:
        - label: I searched existing issues for this request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this feature solve?
      description: Describe your use case and what is difficult or missing today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like Stream GUI RS to do?
      description: Describe the desired behavior. Technical implementation details are not needed.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Twitch browsing / search
        - Playback / Streamlink
        - Player integration
        - Settings
        - Notifications / background monitoring
        - Tray / desktop integration
        - Chat integration
        - Keyboard / accessibility
        - Packaging / distribution
        - Developer tools / integrations
        - Other
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Is this platform-specific?
      options:
        - Cross-platform
        - Linux
        - macOS
        - Windows
        - Not sure
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: How do you handle this today, and what other approaches have you considered?
  - type: dropdown
    id: upstream
    attributes:
      label: Does Streamlink Twitch GUI already provide something similar?
      description: Optional context; an upstream feature does not imply automatic one-to-one parity.
      options:
        - "Yes"
        - "No"
        - Not sure
  - type: input
    id: upstream-reference
    attributes:
      label: Related Streamlink Twitch GUI feature or issue
      description: Optionally add a link or a short description.
  - type: markdown
    attributes:
      value: |
        Requests may be redesigned or declined if they require unsafe behavior, such as exposing Twitch credentials to external applications.
