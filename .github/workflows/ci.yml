name: Desktop checks

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

env:
  # For pull requests this is the checked-out merge commit, not the branch head.
  STREAM_GUI_RS_COMMIT: ${{ github.sha }}

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb
            artifact-path: src-tauri/target/debug/bundle/deb/*.deb
          - os: windows-latest
            bundles: nsis
            artifact-path: src-tauri/target/debug/bundle/nsis/*_x64-setup.exe
          - os: macos-latest
            bundles: app,dmg
            artifact-path: src-tauri/target/debug/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libdbus-1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend
        run: npm ci
      - name: Frontend type check and production build
        run: npm run build
      - name: Frontend concurrency contracts
        run: npm test
      - name: Candidate promotion guards
        run: node --test scripts/verify-release-candidate.tests.mjs
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Domain, build configuration, HTTP and native process contracts
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features test-support
      - name: Desktop Rust checks
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets --features test-support
      - name: Native desktop and notification acceptance contracts
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --features test-support desktop::
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --features test-support,notification-acceptance desktop::
      - name: Linux browser dispatch and launcher cleanup
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test linux_browser_open --features test-support
      - name: Rust lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --features test-support -- -D warnings
      - name: Tauri desktop build (no packaging or publishing)
        env:
          # Use the registered public ID when available; forks/Dependabot can still compile.
          # Synthetic fallback is only for these non-publishing checks, never releases.
          TWITCH_CLIENT_ID_BUILD: ${{ secrets.TWITCH_CLIENT_ID_BUILD || 'ciCompileOnlyPublicClient123' }}
        run: npm run tauri build -- --debug --no-bundle --features custom-protocol --ci
      - name: Require registered ID for acceptance packages
        # Internal PRs need installable artifacts for native acceptance before merge.
        # Fork and Dependabot PRs retain compilation checks without packaging secrets.
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        shell: bash
        env:
          TWITCH_CLIENT_ID_BUILD: ${{ secrets.TWITCH_CLIENT_ID_BUILD }}
        run: |
          if [[ -z "$TWITCH_CLIENT_ID_BUILD" ]]; then
            echo 'Acceptance packaging requires the TWITCH_CLIENT_ID_BUILD repository secret.' >&2
            exit 1
          fi
          if [[ "$RUNNER_OS" != macOS && "$RUNNER_ARCH" != X64 ]]; then
            echo 'Linux and Windows acceptance packages require x86_64 runners.' >&2
            exit 1
          fi
      - name: Build native notification acceptance package
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        env:
          TWITCH_CLIENT_ID_BUILD: ${{ secrets.TWITCH_CLIENT_ID_BUILD }}
        # Rebuild with the opt-in feature; the normal build above must omit it.
        # --bundles selects packaging even with bundle.active=false.
        run: npm run tauri build -- --debug --bundles ${{ matrix.bundles }} --features custom-protocol,notification-acceptance --ci
      - name: Verify packaged Linux protocol dispatch
        if: runner.os == 'Linux' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
        shell: bash
        run: |
          packages=(src-tauri/target/debug/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          STREAM_GUI_TEST_DEB="$PWD/${packages[0]}" cargo test --locked --manifest-path src-tauri/Cargo.toml --test linux_browser_open --features test-support packaged_protocol_dispatch_passes_the_exact_uri_to_the_launcher -- --ignored
      - name: Verify macOS app bundle signature
        if: runner.os == 'macOS' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
        run: |
          codesign --verify --deep --strict --verbose=2 'src-tauri/target/debug/bundle/macos/Stream GUI RS.app'
          codesign --display --verbose=2 'src-tauri/target/debug/bundle/macos/Stream GUI RS.app'
      - name: Verify packaged Windows GUI subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = [System.IO.File]::ReadAllBytes('src-tauri/target/debug/stream-gui-rs.exe')
          $pe = [System.BitConverter]::ToInt32($binary, 0x3c)
          if ([System.BitConverter]::ToUInt16($binary, 0) -ne 0x5a4d -or
              [System.BitConverter]::ToUInt32($binary, $pe) -ne 0x00004550) {
            throw 'The packaged application is not a Windows PE executable.'
          }
          # Subsystem is 68 bytes into the PE optional header (after signature + COFF).
          if ([System.BitConverter]::ToUInt16($binary, $pe + 24 + 68) -ne 2) {
            throw 'The packaged application must use the Windows GUI subsystem.'
          }
      - name: Upload native notification acceptance package
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stream-gui-rs-notification-acceptance-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14
