name: Desktop checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libdbus-1-dev libxdo-dev librsvg2-dev patchelf
      - name: Install frontend
        run: npm ci
      - name: Frontend type check and production build
        run: npm run build
      - name: Frontend concurrency contracts
        run: npm test
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Domain, build configuration, HTTP and native process contracts
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features test-support
      - name: Desktop Rust checks
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets --features test-support
      - name: Rust lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --features test-support -- -D warnings
      - name: Tauri desktop build (no packaging or publishing)
        env:
          # Synthetic public ID: compile-only artifact, never used for OAuth or a release.
          TWITCH_CLIENT_ID_BUILD: ciCompileOnlyPublicClient123
        run: npm run tauri build -- --debug --no-bundle --ci
