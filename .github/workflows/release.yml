name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  STREAM_GUI_RS_COMMIT: ${{ github.sha }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release candidate
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source, version and candidate identity
        id: metadata
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          version=$(node -p 'require("./package.json").version')
          node scripts/set-version.mjs --check "$version"
          test -f docs/release-notes.md
          test "$(head -n 1 docs/release-notes.md)" = "# Stream GUI RS $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "Source: $GITHUB_SHA; version: $version; candidate run: $GITHUB_RUN_ID"
            printf '\nAfter the builds and artifact verification succeed, this run waits for the `release` environment.\n'
            printf 'Download and test the artifacts, then approve the deployment to create the annotated `v%s` tag on this commit and publish these exact files.\n' "$version"
          } >> "$GITHUB_STEP_SUMMARY"

  linux-x86_64:
    name: Linux x86_64 packages
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install native build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libdbus-1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - run: npm ci
      - name: Require registered Twitch client ID
        env:
          TWITCH_CLIENT_ID_BUILD: ${{ secrets.TWITCH_CLIENT_ID_BUILD }}
        run: test -n "$TWITCH_CLIENT_ID_BUILD"
      - name: Build release packages
        env:
          TWITCH_CLIENT_ID_BUILD: ${{ secrets.TWITCH_CLIENT_ID_BUILD }}
        run: npm run tauri build -- --bundles appimage,deb,rpm --features custom-protocol --ci -- --locked
      - name: Repair AppImage host-library compatibility
        shell: bash
        run: |
          appimage=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$appimage"
          scripts/patch-appimage.sh "$appimage" "$appimage" "$VERSION"
      - name: Verify frozen dependencies
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Stage release files
        shell: bash
        run: |
          mkdir release
          cp "$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)" "release/Stream-GUI-RS_${VERSION}_linux_x86_64.AppImage"
          cp "$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)" "release/Stream-GUI-RS_${VERSION}_linux_amd64.deb"
          cp "$(find src-tauri/target/release/bundle/rpm -maxdepth 1 -name '*.rpm' -print -quit)" "release/Stream-GUI-RS_${VERSION}_linux_x86_64.rpm"
          test "$(dpkg-deb -f "release/Stream-GUI-RS_${VERSION}_linux_amd64.deb" Architecture)" = amd64
          test "$(rpm -qp --qf '%{ARCH}' "release/Stream-GUI-RS_${VERSION}_linux_x86_64.rpm")" = x86_64
          cd release
          sha256sum Stream-GUI-RS_* > SHA256SUMS_linux_x86_64.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Stream-GUI-RS_${{ needs.prepare.outputs.version }}_linux_x86_64
          path: release/
          if-no-files-found: error
          retention-days: 30

  windows-x86_64:
    name: Windows x86_64 packages
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source commit and architecture
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_ARCH" = X64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: npm ci
      - name: Require registered Twitch client ID
        shell: pwsh
        env:
          TWITCH_CLIENT_ID_BUILD: ${{ secrets.TWITCH_CLIENT_ID_BUILD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TWITCH_CLIENT_ID_BUILD)) {
            throw 'Release packaging requires the TWITCH_CLIENT_ID_BUILD repository secret.'
          }
      - name: Build release installer
        env:
          TWITCH_CLIENT_ID_BUILD: ${{ secrets.TWITCH_CLIENT_ID_BUILD }}
        run: npm run tauri build -- --bundles nsis --features custom-protocol --ci -- --locked
      - name: Verify frozen dependencies
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Report Authenticode status
        shell: pwsh
        run: Get-AuthenticodeSignature 'src-tauri/target/release/stream-gui-rs.exe' | Format-List Status,StatusMessage,SignerCertificate
      - name: Verify GUI subsystem and stage release files
        shell: pwsh
        run: |
          $app = 'src-tauri/target/release/stream-gui-rs.exe'
          $binary = [System.IO.File]::ReadAllBytes($app)
          $pe = [System.BitConverter]::ToInt32($binary, 0x3c)
          if ([System.BitConverter]::ToUInt16($binary, $pe + 24 + 68) -ne 2) {
            throw 'The packaged application must use the Windows GUI subsystem.'
          }
          New-Item -ItemType Directory -Path release | Out-Null
          $source = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*_x64-setup.exe' | Select-Object -First 1
          if (-not $source) { throw 'NSIS installer was not produced.' }
          $installerName = "Stream-GUI-RS_$env:VERSION`_windows_x86_64-setup.exe"
          Copy-Item $source.FullName "release/$installerName"

          $portableRoot = Join-Path $env:RUNNER_TEMP 'stream-gui-rs-portable'
          New-Item -ItemType Directory -Path $portableRoot | Out-Null
          Copy-Item $app (Join-Path $portableRoot 'stream-gui-rs.exe')
          Copy-Item 'LICENSE' (Join-Path $portableRoot 'LICENSE')
          Copy-Item 'README.md' (Join-Path $portableRoot 'README.md')
          $zipName = "Stream-GUI-RS_$env:VERSION`_windows_x86_64.zip"
          Compress-Archive -Path "$portableRoot/*" -DestinationPath "release/$zipName" -CompressionLevel Optimal
          node scripts/generate-scoop-manifest.mjs $env:VERSION "release/$zipName" 'release/stream-gui-rs.json'

          $manifest = Get-Content 'release/stream-gui-rs.json' -Raw | ConvertFrom-Json
          if ($manifest.architecture.'64bit'.hash -ne (Get-FileHash "release/$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()) {
            throw 'Scoop manifest hash does not match the portable archive.'
          }
          $checksums = Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content 'release/SHA256SUMS_windows_x86_64.txt' -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Stream-GUI-RS_${{ needs.prepare.outputs.version }}_windows_x86_64
          path: release/
          if-no-files-found: error
          retention-days: 30

  macos-universal:
    name: macOS universal disk image
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source commit and architecture
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = arm64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - name: Require registered Twitch client ID
        env:
          TWITCH_CLIENT_ID_BUILD: ${{ secrets.TWITCH_CLIENT_ID_BUILD }}
        run: test -n "$TWITCH_CLIENT_ID_BUILD"
      - name: Build release disk image
        env:
          TWITCH_CLIENT_ID_BUILD: ${{ secrets.TWITCH_CLIENT_ID_BUILD }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg --features custom-protocol --ci -- --locked
      - name: Verify universal application binary
        shell: bash
        run: |
          app=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          executable=$(find "$app/Contents/MacOS" -maxdepth 1 -type f -print -quit)
          test -n "$executable"
          lipo "$executable" -verify_arch arm64 x86_64
          lipo "$executable" -archs
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 11.0
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = io.github.stream-gui-rs
      - name: Verify application bundle signature
        run: |
          codesign --verify --deep --strict --verbose=2 'src-tauri/target/universal-apple-darwin/release/bundle/macos/Stream GUI RS.app'
          codesign --display --verbose=4 'src-tauri/target/universal-apple-darwin/release/bundle/macos/Stream GUI RS.app'
      - name: Verify frozen dependencies
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Stage release files
        shell: bash
        run: |
          mkdir release
          cp "$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)" "release/Stream-GUI-RS_${VERSION}_macos_universal.dmg"
          cd release
          shasum -a 256 Stream-GUI-RS_* > SHA256SUMS_macos_universal.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Stream-GUI-RS_${{ needs.prepare.outputs.version }}_macos_universal
          path: release/
          if-no-files-found: error
          retention-days: 30

  verify-artifacts:
    name: Verify complete candidate artifact set
    needs: [prepare, linux-x86_64, windows-x86_64, macos-universal]
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Re-running a build job also re-runs this job. Reject that: the run ID stays
      # the same while the rebuilt bytes may differ from the tested candidate.
      # Re-running only publication after approval keeps these verified files.
      - name: Reject rebuilt candidates
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
          pattern: Stream-GUI-RS_${{ needs.prepare.outputs.version }}_*
      - name: Verify complete release set
        shell: bash
        run: |
          cd release
          expected=(
            "SHA256SUMS_linux_x86_64.txt"
            "SHA256SUMS_macos_universal.txt"
            "SHA256SUMS_windows_x86_64.txt"
            "stream-gui-rs.json"
            "Stream-GUI-RS_${VERSION}_linux_amd64.deb"
            "Stream-GUI-RS_${VERSION}_linux_x86_64.AppImage"
            "Stream-GUI-RS_${VERSION}_linux_x86_64.rpm"
            "Stream-GUI-RS_${VERSION}_macos_universal.dmg"
            "Stream-GUI-RS_${VERSION}_windows_x86_64-setup.exe"
            "Stream-GUI-RS_${VERSION}_windows_x86_64.zip"
          )
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"
          for file in "${expected[@]}"; do test -f "$file"; done
          sha256sum -c SHA256SUMS_linux_x86_64.txt
          sha256sum -c SHA256SUMS_macos_universal.txt
          sha256sum -c SHA256SUMS_windows_x86_64.txt
          zip_hash=$(sha256sum "Stream-GUI-RS_${VERSION}_windows_x86_64.zip" | cut -d' ' -f1)
          manifest_hash=$(jq -r '.architecture["64bit"].hash' stream-gui-rs.json)
          test "$zip_hash" = "$manifest_hash"

  approve-and-tag:
    name: Approve candidate and create release tag
    needs: [prepare, verify-artifacts]
    runs-on: ubuntu-26.04
    # Required reviewers on this environment pause the run until the downloaded
    # candidate has passed the release gate.
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      CANDIDATE_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Create or resume annotated release tag
        shell: bash
        run: bash scripts/create-release-tag.sh

  publish:
    name: Publish tested candidate without rebuilding
    needs: [prepare, verify-artifacts, approve-and-tag]
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: v${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
          pattern: Stream-GUI-RS_${{ needs.prepare.outputs.version }}_*
      - name: Create or resume draft release
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "Stream GUI RS ${VERSION}" \
              --notes-file docs/release-notes.md
          fi
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Verify uploaded assets and publish
        shell: bash
        run: |
          find release -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/expected-assets
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > /tmp/uploaded-assets
          diff -u /tmp/expected-assets /tmp/uploaded-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir uploaded
          diff -qr release uploaded
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  update-package-repositories:
    name: Request package repository updates
    needs: publish
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ secrets.PACKAGE_REPOSITORIES_TOKEN }}
    steps:
      - name: Use scheduled fallback when no cross-repository token exists
        if: ${{ env.GH_TOKEN == '' }}
        run: echo 'PACKAGE_REPOSITORIES_TOKEN is not configured; the daily Scoop and Homebrew updaters will publish this version.'
      - name: Dispatch Scoop and Homebrew updates
        if: ${{ env.GH_TOKEN != '' }}
        shell: bash
        run: |
          gh api --method POST repos/ChrisLauinger77/scoop-bucket/dispatches -f event_type=update-scoop
          gh api --method POST repos/ChrisLauinger77/homebrew-cask/dispatches -f event_type=update-cask -F 'client_payload[cask]=stream-gui-rs'

  publish-winget:
    name: Request WinGet manifest update
    needs: [prepare, publish]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Skip when no WinGet token exists
        if: ${{ env.WINGET_TOKEN == '' }}
        run: echo 'WINGET_TOKEN is not configured; submit the WinGet manifest update manually.'
      - name: Request WinGet manifest update
        if: ${{ env.WINGET_TOKEN != '' }}
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: ChrisLauinger77.Stream-GUI-RS
          release-tag: v${{ needs.prepare.outputs.version }}
          installers-regex: '^Stream-GUI-RS_[0-9]+\.[0-9]+\.[0-9]+_windows_x86_64-setup\.exe$'
          token: ${{ env.WINGET_TOKEN }}
