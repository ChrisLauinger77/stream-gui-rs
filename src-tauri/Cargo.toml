[package]
name = "stream-gui-rs"
version = "0.1.0"
description = "A modern Rust/Tauri desktop frontend for watching Twitch streams via Streamlink"
authors = ["ChrisLauinger77"]
license = "GPL-3.0-only"
repository = "https://github.com/ChrisLauinger77/stream-gui-rs"
homepage = "https://github.com/ChrisLauinger77/stream-gui-rs"
edition = "2024"
rust-version = "1.85"
default-run = "stream-gui-rs"

[lib]
name = "stream_gui_rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "stream-gui-rs"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:webbrowser", "dep:gio"]
custom-protocol = ["tauri?/custom-protocol"]
test-support = []

[[bin]]
name = "fake-streamlink"
path = "tests/support/fake_streamlink.rs"
required-features = ["test-support"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
webbrowser = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net", "test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
ts-rs = "12"
zeroize = { version = "1", features = ["serde"] }
tempfile = "3"
tokio-util = { version = "0.7", features = ["rt"] }
fs2 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
gio = { version = "0.18", optional = true }
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
