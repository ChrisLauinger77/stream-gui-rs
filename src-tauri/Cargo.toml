[package]
name = "twitch-gui-rs"
version = "0.1.0"
description = "Phase 0 of an independent Twitch desktop GUI"
edition = "2024"
rust-version = "1.85"
default-run = "twitch-gui-rs"

[lib]
name = "twitch_gui_rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "twitch-gui-rs"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:webbrowser"]
custom-protocol = ["tauri?/custom-protocol"]
test-support = []

[[bin]]
name = "fake-streamlink"
path = "tests/support/fake_streamlink.rs"
required-features = ["test-support"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
webbrowser = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net", "test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
ts-rs = "11"
zeroize = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
