[package]
name = "stream-gui-rs"
version = "1.0.0"
description = "A modern Rust/Tauri desktop frontend for watching Twitch streams via Streamlink"
authors = ["ChrisLauinger77"]
license = "GPL-3.0-only"
repository = "https://github.com/ChrisLauinger77/stream-gui-rs"
homepage = "https://github.com/ChrisLauinger77/stream-gui-rs"
edition = "2024"
rust-version = "1.88"
default-run = "stream-gui-rs"

[lib]
name = "stream_gui_rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "stream-gui-rs"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri-plugin-single-instance", "dep:tauri", "dep:tauri-build", "dep:webbrowser", "dep:gio", "dep:gtk", "dep:windows", "dep:windows-core", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:objc2-user-notifications", "dep:block2"]
custom-protocol = ["tauri?/custom-protocol"]
test-support = []
# Opt-in native notification acceptance controls; build.rs rejects release profiles.
notification-acceptance = []

[[bin]]
name = "background-smoke"
path = "tests/support/background_smoke.rs"
required-features = ["desktop", "test-support"]

[[bin]]
name = "fake-streamlink"
path = "tests/support/fake_streamlink.rs"
required-features = ["test-support"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
webbrowser = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net", "test-util"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
url = "2"
# Already in the lockfile through Tauri; use its reviewed semantic-version parser.
semver = "1"
uuid = { version = "1", features = ["v4"] }
ts-rs = "12"
zeroize = { version = "1", features = ["serde"] }
tempfile = "3"
tokio-util = { version = "0.7", features = ["rt"] }
fs2 = "0.4"
keyring-core = "1"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
# Native forwarding on argv-based platforms; macOS uses LaunchServices events.
tauri-plugin-single-instance = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
# Tauri's string-only About credits cannot carry a clickable macOS link.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSAttributedString", "NSColor"], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSAttributedString", "NSBundle", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL", "NSValue", "NSLocale"], optional = true }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger"], optional = true }
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
gio = { version = "0.18", optional = true }
# Already provided by Tauri; configure its existing native Wayland title bar.
gtk = { version = "0.18", optional = true }
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Required by windows::core::implement for the native COM activator.
windows-core = { version = "0.62", optional = true }
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Notifications", "Win32_Security", "Win32_System_Threading"], optional = true }
windows-native-keyring-store = { version = "1.1.0", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
